
name: Auth System CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # Backend: compile and run JUnit/Mockito/integration tests
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: auth_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: authBackend

    env:
      MYSQL_URL: jdbc:mysql://127.0.0.1:3306/auth_db
      MYSQL_ROOT_USERNAME: root
      MYSQL_ROOT_PASSWORD: rootpassword

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run all backend tests
        run: mvn --batch-mode clean verify

  # Frontend: lint, type-check, tests and production build
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: authFrontend

    env:
      VITE_API_BASE_BACKEND_URL: /api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: authFrontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Frontend tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

  # Independent MySQL engine smoke test
  mysql-tests:
    name: MySQL Smoke Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: auth_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Verify MySQL connection and version
        run: |
          mysql -h 127.0.0.1 -uroot -prootpassword \
            -e "SELECT VERSION();"

      - name: Verify auth_db
        run: |
          mysql -h 127.0.0.1 -uroot -prootpassword \
            -e "SHOW DATABASES LIKE 'auth_db';"

      - name: Verify SQL operations
        run: |
          mysql -h 127.0.0.1 -uroot -prootpassword auth_db -e "
            CREATE TABLE ci_test (
              id INT PRIMARY KEY,
              name VARCHAR(50)
            );
            INSERT INTO ci_test VALUES (1, 'CI Working');
            SELECT * FROM ci_test;
            DROP TABLE ci_test;
          "

  # Build Docker images only after all tests pass
  docker-build:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - frontend-tests
      - mysql-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t auth-backend:ci ./authBackend

      - name: Build frontend image
        run: docker build -t auth-frontend:ci ./authFrontend

      - name: Pull MySQL image
        run: docker pull mysql:8.4
