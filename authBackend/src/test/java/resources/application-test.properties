# H2 in-memory database
#spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=MySQL//not worked
spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
#Worked
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true


# Application configuration
app.cors.frontend-url=http://localhost:3000
security.jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
security.jwt.issuer=auth-test
security.jwt.access-ttl-seconds=900
security.jwt.refresh-ttl-seconds=604800

security.jwt.refresh-token-cookie-name=refresh_token
security.jwt.access-token-cookie-name=access_token
security.jwt.cookie-secure=false
security.jwt.cookie-http-only=true
security.jwt.cookie-same-site=Lax
security.jwt.cookie-domain=localhost
app.auth.frontend.success-url=http://localhost:5173/oauth/success
app.auth.frontend.failure-url=http://localhost:5173/oauth/failure
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.host=localhost
spring.mail.port=1025