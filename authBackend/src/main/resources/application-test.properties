# H2 in-memory database
#spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=MySQL//not worked
#spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER
#Worked
spring.datasource.url=jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true


# Application configuration
app.cors.frontend-url=http://localhost:3000
security.jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
security.jwt.issuer=auth-test
security.jwt.access-ttl-seconds=900
security.jwt.refresh-ttl-seconds=604800

security.jwt.refresh-token-cookie-name=refresh_token
security.jwt.access-token-cookie-name=access_token
security.jwt.cookie-secure=false
security.jwt.cookie-http-only=true
security.jwt.cookie-same-site=Lax
security.jwt.cookie-domain=localhost
app.auth.frontend.success-url=http://localhost:5173/oauth/success
app.auth.frontend.failure-url=http://localhost:5173/oauth/failure
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.host=localhost
spring.mail.port=1025
spring.otp.validation.time=100


# Login: 5 requests per minute
resilience4j.ratelimiter.instances.loginLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.loginLimiter.timeout-duration=0

# Register: 3 requests per hour
resilience4j.ratelimiter.instances.registerLimiter.limit-for-period=3
resilience4j.ratelimiter.instances.registerLimiter.limit-refresh-period=1h
resilience4j.ratelimiter.instances.registerLimiter.timeout-duration=0

# Send OTP: 3 requests per 10 minutes
resilience4j.ratelimiter.instances.otpSendLimiter.limit-for-period=3
resilience4j.ratelimiter.instances.otpSendLimiter.limit-refresh-period=10m
resilience4j.ratelimiter.instances.otpSendLimiter.timeout-duration=0

# Verify OTP: 5 requests per 5 minutes
resilience4j.ratelimiter.instances.otpVerifyLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.otpVerifyLimiter.limit-refresh-period=5m
resilience4j.ratelimiter.instances.otpVerifyLimiter.timeout-duration=0

# Forgot Password: 3 requests per 15 minutes
resilience4j.ratelimiter.instances.forgotPasswordLimiter.limit-for-period=3
resilience4j.ratelimiter.instances.forgotPasswordLimiter.limit-refresh-period=15m
resilience4j.ratelimiter.instances.forgotPasswordLimiter.timeout-duration=0

# Reset Password: 5 requests per 15 minutes
resilience4j.ratelimiter.instances.resetPasswordLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.resetPasswordLimiter.limit-refresh-period=15m
resilience4j.ratelimiter.instances.resetPasswordLimiter.timeout-duration=0

# Refresh Token: 10 requests per minute
resilience4j.ratelimiter.instances.refreshLimiter.limit-for-period=10
resilience4j.ratelimiter.instances.refreshLimiter.limit-refresh-period=1m
resilience4j.ratelimiter.instances.refreshLimiter.timeout-duration=0

management.health.mail.enabled=false